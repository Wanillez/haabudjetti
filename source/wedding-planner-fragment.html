  function createRecoverySnapshot(reason = 'Autosave', force = false) {
    try {
      const serialized = JSON.stringify(state);
      const snapshots = readRecoverySnapshots();
      if (!force && snapshots[0] && JSON.stringify(snapshots[0].state) === serialized) return false;
      snapshots.unshift({ id:`${Date.now()}-${Math.random().toString(16).slice(2)}`, timestamp:new Date().toISOString(), reason, state:JSON.parse(serialized) });

    } catch { return false; }

      { group:'Data safety', id:'backup-trio', title:'Triple protected', description:'Download three JSON backups.', icon:'archive', series:4, target:3, value:s=>s.exports },
      { group:'Data safety', id:'import-explorer', title:'Plan traveller', description:'Import a wedding plan backup.', icon:'upload', series:2, target:1, value:s=>s.imports },
      { group:'Data safety', id:'recovery-time-traveller', title:'Time traveller', description:'Restore a recovery snapshot.', icon:'history', series:6, target:1, value:s=>s.restores }
    ];
    const catalog = Array.isArray(globalThis.WEDDING_ACHIEVEMENT_CATALOG)
      ? new Map(globalThis.WEDDING_ACHIEVEMENT_CATALOG.map(item => [item.id, item]))
      : new Map();
    return definitions.map(definition => {
      const override = catalog.get(definition.id);
      return override ? { ...definition, ...override, value: definition.value } : definition;
    });
  }

  function rewardXpBreakdown(stats, unlockedCount = state.rewards?.unlocked?.length || 0) {
    return [
      { label:'Wedding journey', icon:'calendar-heart', series:2, xp:Number(stats.weddingDateSet) * 40 + Number(stats.websiteSet) * 40 + Number(stats.customEventName) * 20 },
      { label:'Checklist', icon:'list-checks', series:1, xp:stats.checklistTasks * 4 + stats.completedTasks * 30 },
      { label:'Budget', icon:'wallet-cards', series:5, xp:(stats.totalBudget > 0 ? 40 : 0) + stats.budgetItems * 15 + stats.budgetMoneyRows * 20 + stats.paymentCount * 25 },
      { label:'Guests', icon:'users', series:2, xp:stats.guests * 8 + stats.invitationsSent * 5 + stats.rsvpAnswered * 8 + stats.drinkChoices * 3 + (stats.plusOnesLinked + stats.childrenLinked) * 10 },
      { label:'Vendors', icon:'store', series:3, xp:stats.vendors * 20 + stats.vendorsBooked * 15 + stats.vendorsContracted * 15 },
      { label:'Calendar & venues', icon:'calendar-heart', series:6, xp:stats.calendarEvents * 12 + stats.ceremonyFields * 10 + stats.receptionFields * 10 + stats.timelineItems * 8 },
      { label:'Seating & supplies', icon:'armchair', series:4, xp:stats.seatingItems * 2 + stats.assignedSeats * 5 + stats.supplies * 4 + stats.purchasedSupplies * 12 },
      { label:'Data safety', icon:'shield-check', series:5, xp:Math.min(stats.manualSaves,5) * 5 + Math.min(stats.exports,5) * 10 + Math.min(stats.imports,3) * 15 + Math.min(stats.restores,3) * 15 },
      { label:'Achievement bonuses', icon:'trophy', series:4, xp:unlockedCount * 75 }
    ];
  }

  function rewardLevel(xp = state.rewards?.xp || 0) {
    const points = Math.max(0, Number(xp) || 0);
    const level = Math.floor(points / 250) + 1;
    const floor = (level - 1) * 250;
    const ceiling = level * 250;
    return { level, floor, ceiling, progress:Math.round((points - floor) / (ceiling - floor) * 100) };
  }

  function syncRewards(announce = true) {
    const stats = rewardStats();
    const definitions = achievementDefinitions();
    const previous = Array.isArray(state.rewards?.unlocked) ? state.rewards.unlocked : [];
    const unlockedIds = new Set(previous.map(item => item.id));
    const newlyUnlocked = definitions.filter(definition => definition.value(stats) >= definition.target && !unlockedIds.has(definition.id));
    const now = new Date().toISOString();
    const unlocked = [...previous, ...newlyUnlocked.map(definition => ({ id:definition.id, unlockedAt:now }))];
    const oldXp = Math.max(0, Number(state.rewards?.xp) || 0);
    const calculatedXp = rewardXpBreakdown(stats, unlocked.length).reduce((sum,item) => sum + item.xp, 0);
    const xp = Math.max(oldXp, calculatedXp);
    const oldLevel = rewardLevel(oldXp).level;
    const newLevel = rewardLevel(xp).level;
    state.rewards = { xp, unlocked, actions:{ ...(state.rewards?.actions || {}) } };
    if (announce && (newlyUnlocked.length || newLevel > oldLevel)) {
      const title = newLevel > oldLevel ? `Level ${newLevel} unlocked!` : 'Achievement unlocked!';
      const detail = newlyUnlocked.length
        ? `${newlyUnlocked[0].title}${newlyUnlocked.length > 1 ? ` + ${newlyUnlocked.length - 1} more` : ''} · +${newlyUnlocked.length * 75} XP`
        : `Your planning progress reached ${xp} XP.`;
      ui.rewardToast = { title, detail };
    }
  }

  function incrementRewardAction(key) {
    if (!state.rewards?.actions) state.rewards = { ...(state.rewards || {}), actions:{ manualSaves:0, exports:0, imports:0, restores:0 } };
    state.rewards.actions[key] = Math.max(0, Number(state.rewards.actions[key]) || 0) + 1;
  }

  function daysUntil() {
    if (!state.meta.weddingDate) return null;
    const target = new Date(`${state.meta.weddingDate}T12:00:00`);
    const today = new Date(); today.setHours(12,0,0,0);
    return Math.ceil((target - today) / 86400000);
  }

    const level = rewardLevel().level;

      <div class="recovery-actions"><label class="form-label">Recovery history<select class="form-select" id="recovery-snapshot-select" ${snapshots.length ? '' : 'disabled'}>${snapshots.map(item => `<option value="${esc(item.id)}">${esc(recoveryTimeLabel(item.timestamp))} · ${esc(item.reason)}</option>`).join('')}</select></label><div class="viz-row"><button class="btn" type="button" data-action="restore-recovery" ${snapshots.length ? '' : 'disabled'}><i data-lucide="history" aria-hidden="true"></i>Restore selected</button><button class="btn btn-primary" type="button" data-action="export"><i data-lucide="download" aria-hidden="true"></i>Download backup</button></div></div>

  function achievementProgress(definition, stats) {
    const value = Math.max(0, Number(definition.value(stats)) || 0);
    return { value, pct:Math.min(100, Math.round(value / definition.target * 100)) };
  }

      </div>
    </section>`;
  }

  function renderUpcomingRewards(limit = 3) {
    const stats = rewardStats();
    const unlockedIds = new Set((state.rewards?.unlocked || []).map(item => item.id));
    const upcoming = achievementDefinitions().filter(item => !unlockedIds.has(item.id)).sort((a,b) => achievementProgress(b,stats).pct - achievementProgress(a,stats).pct).slice(0,limit);
    return `<section class="card"><div class="card-heading"><h3>Next achievements</h3><span class="text-small text-muted">+75 XP each</span></div><div class="reward-list">${upcoming.length ? upcoming.map(definition => {

      return `<div class="reward-row" data-reward-series="${definition.series}"><span class="reward-icon"><i data-lucide="${definition.icon}" aria-hidden="true"></i></span><div class="reward-row-main"><div class="level-title-row"><p class="item-title">${esc(definition.title)}</p><span class="text-small metric-number">${Math.min(progress.value,definition.target)} / ${definition.target}</span></div><div class="progress-track reward-progress"><div class="progress-fill" style="width:${progress.pct}%"></div></div></div></div>`;
    }).join('') : `<div class="reward-row" data-reward-series="4"><span class="reward-icon"><i data-lucide="crown" aria-hidden="true"></i></span><div class="reward-row-main"><p class="item-title">All achievements unlocked</p><p class="text-small text-muted">You are a legendary wedding planner.</p></div></div>`}</div></section>`;
  }

  function renderRewards() {
    const stats = rewardStats();
    const definitions = achievementDefinitions();
    const unlockedMap = new Map((state.rewards?.unlocked || []).map(item => [item.id,item]));
    const earnedBreakdown = rewardXpBreakdown(stats, unlockedMap.size);
    const accountedXp = earnedBreakdown.reduce((sum,item) => sum + item.xp, 0);
    const retainedXp = Math.max(0, (state.rewards?.xp || 0) - accountedXp);
    const breakdown = retainedXp ? [...earnedBreakdown, { label:'Progress retained', icon:'history', series:3, xp:retainedXp }] : earnedBreakdown;
    const achievementGroups = [...new Set(definitions.map(item => item.group))];
    return `<div class="section-stack">

      ${renderLevelCard()}
      <div class="reward-overview">

        <section class="card"><div class="card-heading"><h3>XP breakdown</h3><span class="text-small text-muted">Lifetime points</span></div><div class="reward-list">${breakdown.map(item => `<div class="reward-row" data-reward-series="${item.series}"><span class="reward-icon"><i data-lucide="${item.icon}" aria-hidden="true"></i></span><div class="reward-row-main"><p class="item-title">${esc(item.label)}</p></div><span class="metric-number">+${item.xp} XP</span></div>`).join('')}</div></section>
      </div>
      <div class="achievement-groups">${achievementGroups.map(group => {
        const groupItems = definitions.filter(item => item.group === group);

        return `<section class="card"><div class="card-heading"><h3>${esc(group)}</h3><span class="text-small text-muted">${groupUnlocked} / ${groupItems.length} unlocked</span></div><div class="achievement-list">${groupItems.map(definition => {
          const unlocked = unlockedMap.get(definition.id);
          const progress = achievementProgress(definition,stats);
          return `<div class="achievement-row ${unlocked ? 'is-unlocked' : 'is-locked'}" data-reward-series="${definition.series}"><span class="achievement-icon"><i data-lucide="${unlocked ? definition.icon : 'lock-keyhole'}" aria-hidden="true"></i></span><div class="achievement-copy"><p class="item-title">${esc(definition.title)}</p><p class="text-small text-muted">${esc(definition.description)}</p><div class="progress-track reward-progress"><div class="progress-fill" style="width:${progress.pct}%"></div></div></div><span class="viz-badge">${unlocked ? 'Unlocked' : `${Math.min(progress.value,definition.target)} / ${definition.target}`}</span></div>`;
        }).join('')}</div></section>`;
      }).join('')}</div>

  }

  function renderCalendar() {
    const fallbackDate = state.meta.weddingDate || todayIso();
    const cursor = ui.calendarCursor || fallbackDate.slice(0,7);
    const selectedDate = ui.selectedCalendarDate || fallbackDate;
    const [year,month] = cursor.split('-').map(Number);
    const daysInMonth = new Date(year, month, 0).getDate();
    const firstWeekday = (new Date(year, month-1, 1).getDay() + 6) % 7;
    const cells = Array.from({ length:firstWeekday }, () => '').concat(Array.from({ length:daysInMonth }, (_,index) => `${cursor}-${String(index+1).padStart(2,'0')}`));
    while (cells.length % 7) cells.push('');
    const edit = state.calendarEvents.find(item => item.id === ui.editCalendarEvent) || {};
    const formDate = edit.date || selectedDate;
    const selectedEvents = state.calendarEvents.filter(item => item.date === selectedDate).sort((a,b) => (a.time || '99:99').localeCompare(b.time || '99:99') || a.title.localeCompare(b.title));
    const monthEvents = state.calendarEvents.filter(item => item.date?.startsWith(cursor));
    const eventCategories = ['Meeting','Due date','Payment','Booking','Wedding day','Other'];
    const weekdays = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
    const eventSeries = category => Math.max(1, eventCategories.indexOf(category) + 1);
    return `<div class="section-stack">
      ${sectionHead('Calendar', 'Keep meetings, deadlines, payments and wedding plans in one calendar.', `<span class="viz-badge">${monthEvents.length} events this month</span>`)}
      <section class="card calendar-month-card">
        <div class="viz-row calendar-toolbar"><button class="btn" type="button" data-calendar-shift="-1" aria-label="Previous month"><i data-lucide="chevron-left" aria-hidden="true"></i></button><h3>${esc(monthLabel(cursor))}</h3><div class="viz-row"><button class="btn btn-ghost" type="button" data-calendar-today>Today</button><button class="btn" type="button" data-calendar-shift="1" aria-label="Next month"><i data-lucide="chevron-right" aria-hidden="true"></i></button></div></div>
        <div class="calendar-grid" style="margin-top:10px">${weekdays.map(day => `<span class="calendar-weekday text-small">${day}</span>`).join('')}${cells.map(date => {
          if (!date) return '<span class="calendar-spacer" aria-hidden="true"></span>';
          const events = state.calendarEvents.filter(item => item.date === date).sort((a,b) => (a.time || '99:99').localeCompare(b.time || '99:99'));
          const accessibleEvents = events.length ? `, ${events.length} entries: ${events.map(item => item.title).join(', ')}` : ', no entries';

  function renderGuests() {
    const edit = state.guests.find(item => item.id === ui.editGuest) || {};
    const sent = state.guests.filter(item => item.invitation === 'Sent').length;
    const attending = state.guests.filter(item => item.rsvp === 'Attending').length;
    const declined = state.guests.filter(item => item.rsvp === 'Declined').length;
    const invitationStatuses = ['Not sent','Sent'];
    const rsvpStatuses = ['Awaiting reply','Attending','Declined'];
    const drinkStatuses = ['Nothing selected','Alcohol','Alcohol-free'];
    const companionTypes = ['No link','Plus-one','Child'];
    const drinkFilters = ['All','Alcohol','Alcohol-free'];
    const activeDrinkFilter = drinkFilters.includes(ui.guestDrinkFilter) ? ui.guestDrinkFilter : 'All';
    const sortedGuests = [...state.guests].sort((a,b) => a.name.localeCompare(b.name,'en'));
    const visibleGuests = activeDrinkFilter === 'All' ? sortedGuests : sortedGuests.filter(guest => (guest.drinkPreference || 'Nothing selected') === activeDrinkFilter);
    const drinkCount = status => state.guests.filter(guest => (guest.drinkPreference || 'Nothing selected') === status).length;
    const linkableGuests = sortedGuests.filter(guest => guest.id !== edit.id);
    const relationText = guest => {
      const relations = [];
      const linkedGuest = state.guests.find(item => item.id === guest.linkedGuestId);
      if (linkedGuest && guest.companionType === 'Plus-one') relations.push(`Plus-one: ${linkedGuest.name}`);
      if (linkedGuest && guest.companionType === 'Child') relations.push(`Child · adult: ${linkedGuest.name}`);
      state.guests.filter(item => item.id !== guest.id && item.linkedGuestId === guest.id).forEach(item => {
        relations.push(item.companionType === 'Child' ? `Child: ${item.name}` : `Plus-one: ${item.name}`);
      });
      return [...new Set(relations)];
    };
    return `<div class="section-stack">
      ${sectionHead('Guest list', 'Add guests and track invitations, RSVPs and drink choices.', `<button class="btn" type="button" data-guests-to-seating><i data-lucide="armchair" aria-hidden="true"></i>Send attending guests to seating plan</button>`)}
      <div class="viz-grid">
        ${statCard('Guests', String(state.guests.length), 'All added names')}
        ${statCard('Invitations sent', String(sent), `${Math.max(0,state.guests.length-sent)} not sent`)}
        ${statCard('Attending', String(attending), `${declined} declined`)}
      </div>
      <section class="card">
        <div class="card-heading"><h3>${edit.id ? 'Edit guest' : 'Add guest'}</h3></div>
        <form class="form-grid" data-form="guest">
          <input type="hidden" name="id" value="${esc(edit.id)}">
          <label class="form-label">Name<input class="form-control" name="name" value="${esc(edit.name)}" placeholder="First name Last name" required></label>
          <label class="form-label">Contact<input class="form-control" name="contact" value="${esc(edit.contact)}" placeholder="Phone or email"></label>
          <label class="form-label">Invitation<select class="form-select" name="invitation">${options(invitationStatuses, edit.invitation || 'Not sent')}</select></label>
          <label class="form-label">RSVP<select class="form-select" name="rsvp">${options(rsvpStatuses, edit.rsvp || 'Awaiting reply')}</select></label>
          <label class="form-label">Drink choice<select class="form-select" name="drinkPreference">${options(drinkStatuses, edit.drinkPreference || 'Nothing selected')}</select></label>
          <label class="form-label">Plus-one / child<select class="form-select" name="companionType">${options(companionTypes, edit.companionType || 'No link')}</select></label>
          <label class="form-label span-2">Linked guest<select class="form-select" name="linkedGuestId" ${(edit.companionType || 'No link') === 'No link' ? 'disabled' : ''}><option value="">Select a guest</option>${linkableGuests.map(guest => `<option value="${guest.id}" ${guest.id === edit.linkedGuestId ? 'selected' : ''}>${esc(guest.name)}</option>`).join('')}</select><span class="field-help text-small text-muted">Choose whose plus-one or child this guest is.</span></label>
          <label class="form-label span-2">Notes<input class="form-control" name="notes" value="${esc(edit.notes)}" placeholder="Diet, plus-one or other note"></label>
          <div class="form-actions">${edit.id ? '<button class="btn" type="button" data-cancel-edit="guest">Cancel</button>' : ''}<button class="btn btn-primary" type="submit">${edit.id ? 'Save changes' : 'Add guest'}</button></div>
        </form>
      </section>
      <section class="card">
        <div class="card-heading"><h3>Guests</h3><span class="text-small text-muted">${visibleGuests.length} / ${state.guests.length} names</span></div>
        <div class="viz-row guest-filter-bar"><div><p class="text-small text-muted">Filter by drink choice</p><div class="viz-row" role="group" aria-label="Filter guests by drink choice">${drinkFilters.map(filter => `<button class="btn ${filter === activeDrinkFilter ? 'btn-primary' : 'btn-ghost'}" type="button" data-guest-drink-filter="${filter}" aria-pressed="${filter === activeDrinkFilter}">${filter} · ${filter === 'All' ? state.guests.length : drinkCount(filter)}</button>`).join('')}</div></div></div>
        ${visibleGuests.length ? visibleGuests.map(guest => { const relations=relationText(guest); return `<article class="guest-row"><div class="guest-main"><p class="item-title">${esc(guest.name)}</p><p class="text-small text-muted">${esc(guest.contact || 'No contact details')}${guest.notes ? ` · ${esc(guest.notes)}` : ''}</p><div class="guest-relation"><span class="viz-badge">${esc(guest.drinkPreference || 'Nothing selected')}</span>${relations.map(relation => `<span class="text-small">${esc(relation)}</span>`).join('')}</div></div><div class="guest-status-grid"><label class="form-label">Invitation<select class="form-select" data-guest-status="${guest.id}" data-guest-field="invitation" aria-label="Invitation: ${esc(guest.name)}">${options(invitationStatuses, guest.invitation || 'Not sent')}</select></label><label class="form-label">RSVP<select class="form-select" data-guest-status="${guest.id}" data-guest-field="rsvp" aria-label="RSVP: ${esc(guest.name)}">${options(rsvpStatuses, guest.rsvp || 'Awaiting reply')}</select></label><label class="form-label">Drink<select class="form-select" data-guest-status="${guest.id}" data-guest-field="drinkPreference" aria-label="Drink choice: ${esc(guest.name)}">${options(drinkStatuses, guest.drinkPreference || 'Nothing selected')}</select></label></div><div class="item-actions"><button class="btn btn-ghost" type="button" data-edit-guest="${guest.id}"><i data-lucide="pencil" aria-hidden="true"></i><span class="sr-only">Edit ${esc(guest.name)}</span></button><button class="btn btn-ghost" type="button" data-delete-guest="${guest.id}"><i data-lucide="trash-2" aria-hidden="true"></i><span class="sr-only">Delete ${esc(guest.name)}</span></button></div></article>`; }).join('') : empty(state.guests.length ? 'No guests match this drink filter.' : 'Add your first guest.')}
      </section>
    </div>`;
  }

  function categoryTotals() {
    const map = new Map(state.budgetCategories.map(category => [category, { category, planned:0, actual:0, paid:0, items:[] }]));
    state.budget.forEach(row => {
      if (!map.has(row.category)) map.set(row.category, { category: row.category, planned:0, actual:0, paid:0, items:[] });
      const item = map.get(row.category); item.planned += num(row.planned); item.actual += num(row.actual); item.paid += num(row.paid); item.items.push(row);
    });
    return [...map.values()];
  }

  function donutSvg(categories) {
    const total = categories.reduce((s,c) => s + num(c.actual), 0);
    if (!total) return `<svg class="donut" viewBox="0 0 42 42" role="img" aria-labelledby="budget-chart-title budget-chart-desc"><title id="budget-chart-title">Actual spend by category</title><desc id="budget-chart-desc">No actual expenses have been added yet.</desc><circle cx="21" cy="21" r="15.9" fill="none" stroke="var(--muted)" stroke-width="6"></circle><text x="21" y="22.5" text-anchor="middle">0 €</text></svg>`;
    let offset = 25;
    const circles = categories.map((c,i) => {
      if (c.actual <= 0) return '';
      const pct = c.actual / total * 100;
      const circle = `<circle cx="21" cy="21" r="15.9" fill="none" stroke="${colors[i % colors.length]}" stroke-width="6" stroke-dasharray="${pct} ${100-pct}" stroke-dashoffset="${offset}" transform="rotate(-90 21 21)"></circle>`;
      offset -= pct; return circle;
    }).join('');
    const desc = categories.filter(c=>c.actual>0).map(c=>`${c.category} ${money(c.actual)}`).join(', ');
    return `<svg class="donut" viewBox="0 0 42 42" role="img" aria-labelledby="budget-chart-title budget-chart-desc"><title id="budget-chart-title">Actual spend by category</title><desc id="budget-chart-desc">${esc(desc)}</desc><circle cx="21" cy="21" r="15.9" fill="none" stroke="var(--muted)" stroke-width="6"></circle>${circles}<text x="21" y="22.5" text-anchor="middle">${Math.round(total/1000)}k €</text></svg>`;
  }

  function initSeatingCanvas() {
    const PLAN = { width: 710, height: 540 };
    const RAD = Math.PI / 180;
    const seatState = state.seatingPlan || (state.seatingPlan = freshSeatingPlan());
    const canvas = root.querySelector('#seat-plan-canvas');

    const seatUi = {
      itemType:get('seat-item-type'), add:get('seat-add'), copy:get('seat-copy'), delete:get('seat-delete'), reset:get('seat-reset'),
      zoom:get('seat-zoom'), zoomValue:get('seat-zoom-value'), mapRotation:get('seat-map-rotation'), mapRotationValue:get('seat-map-rotation-value'),
      grid:get('seat-grid'), fit:get('seat-fit'), selectedType:get('seat-selected-type'), selectedDetail:get('seat-selected-detail'),
      itemLabel:get('seat-item-label'), guestName:get('seat-guest-name'), itemRotation:get('seat-item-rotation'), itemRotationValue:get('seat-item-rotation-value'),
      clearGuest:get('seat-clear-guest'), nextGuest:get('seat-next-guest'), allGuests:get('seat-all-guests'), guestList:get('seat-guest-list'),
      guestCount:get('seat-guest-count'), tableCount:get('seat-table-count'), chairCount:get('seat-chair-count'), assignedCount:get('seat-assigned-count'),
      waitingCount:get('seat-waiting-count'), status:get('seat-status'), export:get('seat-export'), import:get('seat-import'), importFile:get('seat-import-file'),
      optionBuffetLow:get('seat-option-buffet-low'), optionBuffetHigh:get('seat-option-buffet-high')
    };
    const presets = {
      table90:{w:1.4,h:.9,z:.73}, table45:{w:1.4,h:.45,z:.73}, chair:{w:.49,h:.43,z:.77},
      piano:{w:2.12,h:1.5,z:null}, buffetLow:{w:1.5,h:1,z:.85,limit:2}, buffetHigh:{w:1.5,h:1,z:1.2,limit:3},
      round:{w:1.5,h:1.5,z:.73}
    };
    const labels = { table90:'Table 140 × 90', table45:'Narrow table 140 × 45', round:'Round table', chair:'Chair', piano:'Grand piano', buffetLow:'Buffet 85 cm', buffetHigh:'Buffet 120 cm' };
    const palette = {
      stage:'#f5f0ec', ink:'#4a4c45', paper:'#fffdf9', wall:'#697268', detail:'rgba(105,114,104,.30)', sage:'#7e9c82', sageSoft:'rgba(126,156,130,.24)', sageStrong:'rgba(126,156,130,.62)', pink:'#cc8d9e', pinkSoft:'rgba(204,141,158,.26)'
    };
    let sequence = 1;
    let dirty = false;
    let destroyed = false;
    let drag = null;
    const pointers = new Map();
    const clampValue = (value,min,max) => Math.max(min,Math.min(max,value));
    const normalizeDegrees = value => { let next=((value+180)%360+360)%360-180; return next===-180?180:next; };
    const meter = value => value * (Number(seatState.pxPerMeter) || 14.25);

    const normalizeItem = (item,index) => {
      const migratedType = item.type === 'table' ? 'table90' : item.type === 'buffet' ? 'buffetLow' : item.type;
      const type = presets[migratedType] ? migratedType : 'table90';
      const preset = presets[type];
      return { id:String(item.id || `${type}-${index+1}`), type, x:Number.isFinite(item.x)?item.x:PLAN.width/2, y:Number.isFinite(item.y)?item.y:PLAN.height/2, w:preset.w, h:preset.h, z:Number.isFinite(item.z)?item.z:preset.z, r:Number.isFinite(item.r)?normalizeDegrees(item.r):0, label:typeof item.label==='string'?item.label:'', guest:typeof item.guest==='string'?item.guest:'' };
    };
    seatState.items = (Array.isArray(seatState.items) ? seatState.items : []).map(normalizeItem);
    seatState.view = { x:Number(seatState.view?.x)||0, y:Number(seatState.view?.y)||0, scale:clampValue(Number(seatState.view?.scale)||1,.35,4), rotation:normalizeDegrees(Number(seatState.view?.rotation)||0) };
    seatState.pxPerMeter = Number(seatState.pxPerMeter) || 14.25;
    seatState.showGrid = seatState.showGrid !== false;
    sequence = seatState.items.reduce((max,item) => { const match=item.id.match(/-(\d+)$/); return Math.max(max,match?Number(match[1])+1:max); },1);

    const makeItem = (type,x,y,rotation=0) => ({ id:`${type}-${sequence++}`, type, x, y, w:presets[type].w, h:presets[type].h, z:presets[type].z, r:rotation, label:'', guest:'' });
    const selectedItem = () => seatState.items.find(item => item.id === seatState.selectedId) || null;
    const guestNames = () => String(seatState.guestList || '').split(/\r?\n/).map(name=>name.trim()).filter(Boolean);
    const assignedNames = () => new Set(seatState.items.filter(item=>item.type==='chair'&&String(item.guest||'').trim()).map(item=>item.guest.trim().toLowerCase()));
    const unassignedNames = () => { const assigned=assignedNames(); return guestNames().filter(name=>!assigned.has(name.toLowerCase())); };
    const firstEmptyChair = () => seatState.items.find(item=>item.type==='chair'&&!String(item.guest||'').trim()) || null;
    const countType = type => seatState.items.filter(item=>item.type===type).length;
    const canAddType = type => !presets[type]?.limit || countType(type) < presets[type].limit;
    const shortName = value => { const clean=String(value||'').trim(); if(clean.length<=16)return clean; const parts=clean.split(/\s+/); return parts.length>1?`${parts[0]} ${parts[1][0]}.`:`${clean.slice(0,15)}.`; };
    const dimensionLabel = item => {
      const footprint=`${Math.round(item.w*100)} × ${Math.round(item.h*100)}`;
      return Number.isFinite(item.z) ? `${footprint} × ${Math.round(item.z*100)} cm` : `${footprint} cm`;
    };
    const persist = message => saveState(message || 'Seating plan saved');
    const canvasSize = () => ({ width:canvas.clientWidth||wrap.clientWidth||700, height:canvas.clientHeight||wrap.clientHeight||500 });
    const planToScreen = (x,y) => { const size=canvasSize(), cx=size.width/2, cy=size.height/2, dx=(x-PLAN.width/2)*seatState.view.scale, dy=(y-PLAN.height/2)*seatState.view.scale, angle=seatState.view.rotation*RAD; return {x:cx+seatState.view.x+dx*Math.cos(angle)-dy*Math.sin(angle),y:cy+seatState.view.y+dx*Math.sin(angle)+dy*Math.cos(angle)}; };
    const screenToPlan = (x,y) => { const size=canvasSize(), cx=size.width/2, cy=size.height/2, angle=seatState.view.rotation*RAD, dx=x-cx-seatState.view.x, dy=y-cy-seatState.view.y; return {x:PLAN.width/2+(dx*Math.cos(angle)+dy*Math.sin(angle))/seatState.view.scale,y:PLAN.height/2+(-dx*Math.sin(angle)+dy*Math.cos(angle))/seatState.view.scale}; };
    const localToPlan = (item,x,y) => { const angle=item.r*RAD; return {x:item.x+x*Math.cos(angle)-y*Math.sin(angle),y:item.y+x*Math.sin(angle)+y*Math.cos(angle)}; };
    const planToLocal = (item,point) => { const angle=-item.r*RAD, dx=point.x-item.x, dy=point.y-item.y; return {x:dx*Math.cos(angle)-dy*Math.sin(angle),y:dx*Math.sin(angle)+dy*Math.cos(angle)}; };
    const viewportCenterPlan = () => { const size=canvasSize(); return screenToPlan(size.width/2,size.height/2); };
    const roundRect = (context,x,y,width,height,radius) => { const r=Math.min(radius,Math.abs(width)/2,Math.abs(height)/2); context.beginPath(); context.moveTo(x+r,y); context.arcTo(x+width,y,x+width,y+height,r); context.arcTo(x+width,y+height,x,y+height,r); context.arcTo(x,y+height,x,y,r); context.arcTo(x,y,x+width,y,r); context.closePath(); };

    function drawText(textValue,x,y,size) {
      ctx.save(); ctx.font=`500 ${size}px Arial, sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.lineJoin='round'; ctx.strokeStyle='rgba(255,255,255,.92)'; ctx.lineWidth=Math.max(3/seatState.view.scale,size*.24); ctx.strokeText(textValue,x,y); ctx.fillStyle=palette.ink; ctx.fillText(textValue,x,y); ctx.restore();
    }
    function drawFloorplan() {
      ctx.save();
      ctx.fillStyle=palette.paper;

    if (ui.section === 'seating') seatingCleanup = initSeatingCanvas();
    window.clearTimeout(rewardToastTimer);
    if (ui.rewardToast) rewardToastTimer = window.setTimeout(() => {
      ui.rewardToast = null;
      root.querySelector('[data-reward-toast]')?.remove();
    }, 4600);
  }

  function showPendingRewardToast() {
    root.querySelector('[data-reward-toast]')?.remove();
    if (!ui.rewardToast) return;
    content.insertAdjacentHTML('afterbegin', `<section class="card reward-toast" data-reward-toast role="status" aria-live="polite"><span class="reward-toast-icon"><i data-lucide="trophy" aria-hidden="true"></i></span><div><p class="item-title">${esc(ui.rewardToast.title)}</p><p class="text-small text-muted">${esc(ui.rewardToast.detail)}</p></div></section>`);
    renderNav();
    globalThis.lucide?.createIcons({ attrs: { width:16, height:16 } });
    window.clearTimeout(rewardToastTimer);
    rewardToastTimer = window.setTimeout(() => {
      ui.rewardToast = null;
      root.querySelector('[data-reward-toast]')?.remove();
    }, 4600);
  }

  function switchSection(section) {
    if (!navItems.some(item => item[0] === section)) return;
    ui.section = section;
    render();
    content.focus?.();
  }

  root.addEventListener('click', event => {
    const target = event.target.closest('button');
    if (!target) return;
    if (target.type === 'submit' && target.form) {
      event.preventDefault();
      if (target.form.reportValidity()) handleForm(target.form);
      return;
    }
    if (target.dataset.section) return switchSection(target.dataset.section);
    if (target.dataset.calendarShift) {
      const cursor = ui.calendarCursor || (state.meta.weddingDate || todayIso()).slice(0,7);
      const [year,month] = cursor.split('-').map(Number);
      const shifted = new Date(year, month-1+Number(target.dataset.calendarShift), 1);
      ui.calendarCursor = `${shifted.getFullYear()}-${String(shifted.getMonth()+1).padStart(2,'0')}`;
      ui.selectedCalendarDate = `${ui.calendarCursor}-01`;
      render();
      return;
    }
    if (target.dataset.calendarToday !== undefined) {
      ui.selectedCalendarDate = todayIso();
      ui.calendarCursor = ui.selectedCalendarDate.slice(0,7);
      render();
      return;
    }
    if (target.dataset.calendarDate) {
      ui.selectedCalendarDate = target.dataset.calendarDate;
      ui.calendarCursor = target.dataset.calendarDate.slice(0,7);
      ui.editCalendarEvent = null;
      render();
      return;
    }
    if (target.dataset.guestDrinkFilter !== undefined) {
      ui.guestDrinkFilter = target.dataset.guestDrinkFilter;
      render();
      return;
    }
    if (target.dataset.guestsToSeating !== undefined) {
      const names = state.guests.filter(guest => guest.rsvp === 'Attending').map(guest => guest.name.trim()).filter(Boolean);
      if (!names.length) {
        const badge = root.querySelector('#save-status');
        if (badge) badge.textContent = 'Mark at least one guest as attending first';
        return;
      }
      mutate(() => { state.seatingPlan.guestList = names.join('\n'); ui.section = 'seating'; }, `${names.length} guests sent to the seating plan`);
      return;
    }
    const action = target.dataset.action;
    if (action === 'save') {
      incrementRewardAction('manualSaves');
      saveState('Saved to browser', false);
      createRecoverySnapshot('Manual save', true);
      navigator.storage?.persist?.().catch(() => {});
      showPendingRewardToast();
      return;
    }
    if (action === 'export') {
      incrementRewardAction('exports');
      saveState('Backup downloaded', false);
      createRecoverySnapshot('Downloaded backup', true);
      const blob = new Blob([JSON.stringify(state, null, 2)], { type:'application/json' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `wedding-plan-${new Date().toISOString().slice(0,10)}.json`;
      link.click(); URL.revokeObjectURL(link.href); showPendingRewardToast(); return;
    }
    if (action === 'import') { createRecoverySnapshot('Before import', true); fileInput.click(); return; }
    if (action === 'restore-recovery') {
      const recoverySelect = root.querySelector('#recovery-snapshot-select');
      const recovery = readRecoverySnapshots().find(item => item.id === recoverySelect?.value);
      if (!recovery) return;
      if (confirm(`Restore the recovery point from ${recoveryTimeLabel(recovery.timestamp)}? Your current data will be kept as a separate recovery point.`)) {
        createRecoverySnapshot('Before recovery restore', true);
        state = normalizeState(recovery.state);
        Object.assign(ui,{section:'dashboard',editBudget:null,editBudgetCategory:null,editBudgetPayment:null,editVendor:null,editTable:null,editSupply:null,editCalendarEvent:null,editGuest:null,guestDrinkFilter:'All',calendarCursor:null,selectedCalendarDate:null,rewardToast:null});
        incrementRewardAction('restores');
        saveState('Recovery restored');
        render();
      }
      return;
    }
    if (action === 'reset') {
      if (confirm('Are you sure you want to clear everything and restore the starter template? Your current data will remain available in Recovery history.')) {
        createRecoverySnapshot('Before reset', true);
        mutate(() => { state = freshState(); Object.assign(ui,{section:'dashboard',editBudget:null,editBudgetCategory:null,editBudgetPayment:null,editVendor:null,editTable:null,editSupply:null,editCalendarEvent:null,editGuest:null,guestDrinkFilter:'All',calendarCursor:null,selectedCalendarDate:null,rewardToast:null}); }, 'Starter template restored');
      }
      return;
    }
    const cancel = target.dataset.cancelEdit;
    if (cancel) { ui[`edit${cancel[0].toUpperCase()}${cancel.slice(1)}`] = null; render(); return; }
    if (target.dataset.deleteBudget) {
      const id = target.dataset.deleteBudget;
      mutate(() => { state.budget = state.budget.filter(item => item.id !== id); state.budgetPayments = state.budgetPayments.filter(payment => payment.budgetId !== id); if (ui.editBudget === id) ui.editBudget = null; if (ui.editBudgetPayment && !state.budgetPayments.some(payment => payment.id === ui.editBudgetPayment)) ui.editBudgetPayment = null; }, 'Subcategory and its payment shares deleted');
      return;
    }
    if (target.dataset.editBudgetCategory) {
      ui.editBudgetCategory = target.dataset.editBudgetCategory;
      render();
      return;
    }
    if (target.dataset.deleteBudgetCategory) {
      const category = target.dataset.deleteBudgetCategory;
      mutate(() => {
        const removedBudgetIds = new Set(state.budget.filter(row => row.category === category).map(row => row.id));
        state.budgetCategories = state.budgetCategories.filter(name => name !== category);
        state.budget = state.budget.filter(row => row.category !== category);
        state.budgetPayments = state.budgetPayments.filter(payment => !removedBudgetIds.has(payment.budgetId));
        if (ui.editBudgetCategory === category) ui.editBudgetCategory = null;
        if (ui.editBudget && !state.budget.some(row => row.id === ui.editBudget)) ui.editBudget = null;
      }, 'Main category and its subcategories deleted');
      return;
    }
    const map = [
      ['editBudget','budget'],['editVendor','vendors'],['deleteVendor','vendors'],
      ['editTable','tables'],['deleteTable','tables'],['editSupply','supplies'],['deleteSupply','supplies'],
      ['editCalendarEvent','calendarEvents'],['deleteCalendarEvent','calendarEvents'],['editGuest','guests'],['deleteGuest','guests'],
      ['editBudgetPayment','budgetPayments'],['deleteBudgetPayment','budgetPayments']
    ];
    for (const [key, collection] of map) {
      const id = target.dataset[key]; if (!id) continue;
      if (key.startsWith('edit')) {
        ui[key] = id;
        if (key === 'editCalendarEvent') {
          const calendarEvent = state.calendarEvents.find(item => item.id === id);
          if (calendarEvent) { ui.selectedCalendarDate = calendarEvent.date; ui.calendarCursor = calendarEvent.date.slice(0,7); }
        }
        render(); return;
      }
      const targetItem = state[collection].find(item => item.id === id);
      const label = targetItem?.item || targetItem?.name || targetItem?.title || targetItem?.payer || 'item';
      if (confirm(`Delete ${label}?`)) mutate(() => {
        state[collection] = state[collection].filter(item => item.id !== id);
        if (collection === 'guests') state.guests.forEach(guest => {
          if (guest.linkedGuestId === id) {
            guest.linkedGuestId = '';
            guest.companionType = 'No link';
          }
        });
      }, 'Deleted');
      return;
    }
    if (target.dataset.deleteCheck) {
      const id = target.dataset.deleteCheck;
      mutate(() => { state.checklist = state.checklist.filter(item => item.id !== id); }, 'Task deleted'); return;
    }
    if (target.dataset.deleteTimeline) {
      const id = target.dataset.deleteTimeline;
      mutate(() => { state.timeline = state.timeline.filter(item => item.id !== id); }, 'Timeline item deleted'); return;
    }
    if (target.dataset.vendorBudget) {
      const vendor = state.vendors.find(v => v.id === target.dataset.vendorBudget); if (!vendor) return;
      mutate(() => {
        if (!state.budgetCategories.length) state.budgetCategories.push('Other');
        const vendorCategory = state.budgetCategories.includes(vendor.type)
          ? vendor.type
          : state.budgetCategories.includes('Other') ? 'Other' : state.budgetCategories[0];
        let row = state.budget.find(b => b.sourceVendorId === vendor.id);
        if (!row) { row = { id:uid(), category:vendorCategory, item:vendor.name, planned:num(vendor.total), actual:num(vendor.total), paid:num(vendor.deposit), due:'', notes:`Vendor: ${vendor.type}`, sourceVendorId:vendor.id }; state.budget.push(row); }
        else { row.item=vendor.name; row.planned=num(vendor.total); row.actual=num(vendor.total); row.paid=num(vendor.deposit); }
        ui.section = 'budget'; ui.editBudget = row.id;
      }, 'Vendor added to budget');
    }
  });

  root.addEventListener('change', event => {
    if (event.target.matches('[name="companionType"]')) {
      const linkedGuestSelect = event.target.form?.elements?.linkedGuestId;
      if (linkedGuestSelect) {
        const enabled = event.target.value !== 'No link';
        linkedGuestSelect.disabled = !enabled;
        if (!enabled) linkedGuestSelect.value = '';
      }
    }
    if (event.target.matches('[data-check-id]')) {
      const item = state.checklist.find(i => i.id === event.target.dataset.checkId);
      if (item) mutate(() => { item.done = event.target.checked; }, event.target.checked ? 'Task completed' : 'Task reopened');
    }
    if (event.target.matches('[data-guest-status]')) {
      const guest = state.guests.find(item => item.id === event.target.dataset.guestStatus);
      const field = event.target.dataset.guestField;
      if (guest && ['invitation','rsvp','drinkPreference'].includes(field)) mutate(() => { guest[field] = event.target.value; }, 'Guest status updated');
    }
  });

  function handleForm(form) {
    if (!form) return;
    const data = Object.fromEntries(new FormData(form));
    const kind = form.dataset.form;
    if (kind === 'meta') mutate(() => { state.meta = { eventName:data.eventName.trim(), weddingDate:data.weddingDate, websiteUrl:data.websiteUrl.trim() }; }, 'Wedding details saved');
    if (kind === 'quick-task') mutate(() => { state.checklist.push({ id:uid(), text:data.text.trim(), category:'Quick add', due:'', done:false }); }, 'Quick task added');
    if (kind === 'checklist') mutate(() => { state.checklist.push({ id:uid(), text:data.text.trim(), category:data.category.trim(), due:data.due, done:false }); }, 'Task added');
    if (kind === 'calendar-event') mutate(() => {
      const value = { id:data.id||uid(), date:data.date, time:data.time, title:data.title.trim(), category:data.category, notes:data.notes.trim() };
      const index = state.calendarEvents.findIndex(item => item.id === value.id);
      index >= 0 ? state.calendarEvents[index] = value : state.calendarEvents.push(value);
      ui.editCalendarEvent = null;
      ui.selectedCalendarDate = value.date;
      ui.calendarCursor = value.date.slice(0,7);
    }, data.id ? 'Calendar entry updated' : 'Calendar entry added');
    if (kind === 'guest') {
      const companionType = data.companionType || 'No link';
      const linkedGuestId = companionType === 'No link' ? '' : (data.linkedGuestId || '');
      if (companionType !== 'No link' && !linkedGuestId) {
        const badge = root.querySelector('#save-status');
        if (badge) badge.textContent = 'Select the guest this plus-one or child belongs with';
        return;
      }
      mutate(() => {
      const value = { id:data.id||uid(), name:data.name.trim(), contact:data.contact.trim(), invitation:data.invitation, rsvp:data.rsvp, drinkPreference:data.drinkPreference || 'Nothing selected', companionType, linkedGuestId, notes:data.notes.trim() };
      const index = state.guests.findIndex(item => item.id === value.id);
      index >= 0 ? state.guests[index] = value : state.guests.push(value);
      ui.editGuest = null;
      }, data.id ? 'Guest updated' : 'Guest added');
    }
    if (kind === 'place') mutate(() => { state[form.dataset.scope] = { venue:data.venue.trim(), address:data.address.trim(), time:data.time, contact:data.contact.trim(), notes:data.notes.trim() }; }, 'Venue details saved');
    if (kind === 'timeline') mutate(() => { state.timeline.push({ id:uid(), scope:form.dataset.scope, time:data.time, title:data.title.trim() }); }, 'Timeline item added');
    if (kind === 'vendor') mutate(() => { const value={ id:data.id||uid(), type:data.type.trim(), name:data.name.trim(), contact:data.contact.trim(), total:num(data.total), deposit:num(data.deposit), status:data.status, notes:data.notes.trim() }; const i=state.vendors.findIndex(x=>x.id===value.id); i>=0?state.vendors[i]=value:state.vendors.push(value); ui.editVendor=null; }, data.id ? 'Vendor updated' : 'Vendor added');
    if (kind === 'table') {
      if (num(data.assigned) > num(data.seats)) { alert('Assigned seats cannot exceed the number of seats at the table.'); return; }
      mutate(() => { const value={ id:data.id||uid(), name:data.name.trim(), shape:data.shape, seats:num(data.seats), assigned:num(data.assigned), notes:data.notes.trim() }; const i=state.tables.findIndex(x=>x.id===value.id); i>=0?state.tables[i]=value:state.tables.push(value); ui.editTable=null; }, data.id ? 'Table updated' : 'Table added');
    }
    if (kind === 'supply') mutate(() => { const value={ id:data.id||uid(), item:data.item.trim(), qty:num(data.qty), owner:data.owner.trim(), status:data.status, cost:num(data.cost), notes:data.notes.trim() }; const i=state.supplies.findIndex(x=>x.id===value.id); i>=0?state.supplies[i]=value:state.supplies.push(value); ui.editSupply=null; }, data.id ? 'Supply item updated' : 'Supply item added');
    if (kind === 'budget-limit') mutate(() => { state.totalBudget=num(data.totalBudget); }, 'Total budget saved');
    if (kind === 'budget-category') {
      const categoryName = data.categoryName.trim();
      const originalName = data.originalName.trim();
      const duplicate = state.budgetCategories.some(category => category.toLocaleLowerCase('en') === categoryName.toLocaleLowerCase('en') && category !== originalName);
      if (duplicate) {
        const badge = root.querySelector('#save-status');
        if (badge) badge.textContent = 'A main category with this name already exists';
        return;
      }
      mutate(() => {
        if (originalName) {
          const index = state.budgetCategories.indexOf(originalName);
          if (index >= 0) state.budgetCategories[index] = categoryName;
          state.budget.forEach(row => { if (row.category === originalName) row.category = categoryName; });
        } else {
          state.budgetCategories.push(categoryName);
        }
        ui.editBudgetCategory = null;
      }, originalName ? 'Main category renamed' : 'Main category added');
    }
    if (kind === 'budget-payment') {
      const expense = state.budget.find(row => row.id === data.budgetId);
      if (!expense) return;
      mutate(() => {
        const value = { id:data.id||uid(), budgetId:data.budgetId, payer:data.payer.trim(), amount:num(data.amount), date:data.date, notes:data.notes.trim() };
        const index = state.budgetPayments.findIndex(payment => payment.id === value.id);
        index >= 0 ? state.budgetPayments[index] = value : state.budgetPayments.push(value);
        const allocatedToExpense = state.budgetPayments.filter(payment => payment.budgetId === expense.id).reduce((sum,payment) => sum + num(payment.amount), 0);
        expense.paid = Math.max(num(expense.paid), allocatedToExpense);
        expense.actual = Math.max(num(expense.actual), allocatedToExpense);
        ui.editBudgetPayment = null;
      }, data.id ? 'Payment share updated' : 'Payment share added');
    }
    if (kind === 'budget') {
      if (num(data.paid) > num(data.actual)) { alert('The paid amount cannot exceed the actual expense.'); return; }
      const allocatedPayments = state.budgetPayments.filter(payment => payment.budgetId === data.id).reduce((sum,payment) => sum + num(payment.amount), 0);
      if (num(data.paid) < allocatedPayments) { alert(`The paid amount cannot be lower than the amount allocated to payers ${money(allocatedPayments)}.`); return; }
      mutate(() => { const existing=state.budget.find(x=>x.id===data.id); const value={ ...(existing||{}), id:data.id||uid(), category:data.category, item:data.item.trim(), planned:num(data.planned), actual:num(data.actual), paid:num(data.paid), due:data.due, notes:data.notes.trim() }; const i=state.budget.findIndex(x=>x.id===value.id); i>=0?state.budget[i]=value:state.budget.push(value); ui.editBudget=null; }, data.id ? 'Budget item updated' : 'Budget item added');
    }
  }

  root.addEventListener('submit', event => {
    event.preventDefault();
    handleForm(event.target.closest('form'));
  });

  fileInput.addEventListener('change', async () => {
    const file = fileInput.files?.[0]; if (!file) return;
    try {
      const parsed = JSON.parse(await file.text());
      if (!parsed || typeof parsed !== 'object') throw new Error('Invalid file');
      if (Array.isArray(parsed.budget)) {
        state = normalizeState(parsed); Object.assign(ui,{section:'dashboard',editBudget:null,editBudgetCategory:null,editBudgetPayment:null,editVendor:null,editTable:null,editSupply:null,editCalendarEvent:null,editGuest:null,guestDrinkFilter:'All',calendarCursor:null,selectedCalendarDate:null,rewardToast:null});
      } else if (Array.isArray(parsed.items)) {
        const fresh = freshSeatingPlan();
        state.seatingPlan = { ...fresh, ...parsed, items:parsed.items, view:{ ...fresh.view, ...(parsed.view || {}) } };
        ui.section = 'seating';
      } else {
        throw new Error('Invalid file');
      }
      incrementRewardAction('imports');
      saveState('Backup imported'); render();
    } catch { alert('The file could not be imported. Choose a JSON backup exported from this app or a seating plan file.'); }
    fileInput.value = '';
  });

  syncRewards(false);
  try { localStorage.setItem(storageKey, JSON.stringify(state)); } catch {}
  render();
  if (recoveredOnBoot) {
    const badge = root.querySelector('#save-status');
    if (badge) badge.textContent = 'Recovered from automatic browser backup';
    recoveredOnBoot = false;
  }
  queueRecoverySnapshot('App opened');
  navigator.storage?.persist?.().catch(() => {});
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') {
      try { localStorage.setItem(storageKey, JSON.stringify(state)); } catch {}
      createRecoverySnapshot('App closed');
    }
  });
  window.addEventListener('beforeunload', () => {
    try { localStorage.setItem(storageKey, JSON.stringify(state)); } catch {}
    createRecoverySnapshot('App closed');
  });
})();
</script>
