<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' blob: data: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://esm.sh https://fonts.bunny.net https://fonts.googleapis.com https://fonts.gstatic.com https://unpkg.com; style-src 'self' 'unsafe-inline' blob: data: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://esm.sh https://fonts.bunny.net https://fonts.googleapis.com https://fonts.gstatic.com https://unpkg.com; img-src blob: data: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://esm.sh https://fonts.bunny.net https://fonts.googleapis.com https://fonts.gstatic.com https://unpkg.com; font-src blob: data: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://esm.sh https://fonts.bunny.net https://fonts.googleapis.com https://fonts.gstatic.com https://unpkg.com; media-src blob: data: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://esm.sh https://fonts.bunny.net https://fonts.googleapis.com https://fonts.gstatic.com https://unpkg.com; worker-src blob:; connect-src 'self' blob: data:; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Tahdon – Wedding Planner</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div id="wedding-planner-app">
  <header class="card app-header">
    <div class="brand-block">
      <span class="brand-mark" aria-hidden="true"><i data-lucide="flower-2"></i></span>
      <div>
        <p class="passport-kicker text-small">PASSPORT TO OUR WEDDING</p>
        <p class="brand-name">Tahdon.</p>
        <p class="text-small text-muted" id="event-subtitle">Our Wedding</p>
      </div>
    </div>
    <span class="wildflower-sprig" aria-hidden="true"><i data-lucide="flower-2"></i><i data-lucide="leaf"></i><i data-lucide="flower"></i><i data-lucide="sprout"></i></span>
    <div class="viz-row header-actions">
      <span class="viz-badge" id="save-status" role="status" aria-live="polite">Saved</span>
      <button class="btn btn-primary" type="button" data-action="save"><i data-lucide="save" aria-hidden="true"></i>Save</button>
      <button class="btn" type="button" data-action="export"><i data-lucide="download" aria-hidden="true"></i>Download backup</button>
      <button class="btn" type="button" data-action="import"><i data-lucide="upload" aria-hidden="true"></i>Import backup</button>
      <input class="sr-only" id="import-file" type="file" accept="application/json,.json">
    </div>
  </header>

  <div class="app-shell">
    <aside class="card app-sidebar" aria-label="Main navigation">
      <nav class="nav-list" id="main-nav"></nav>
      <div class="sidebar-foot">
        <div class="sidebar-passport text-small"><i data-lucide="flower-2" aria-hidden="true"></i>WILDFLOWER · FIN</div>
        <button class="btn btn-ghost btn-block" type="button" data-action="reset"><i data-lucide="rotate-ccw" aria-hidden="true"></i>Start over</button>
      </div>
    </aside>
    <main class="app-main" id="app-content"></main>
  </div>
</div>



<script src="assets/config-loader.js"></script>
<script src="assets/app.js"></script>

<script src="https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js"></script>
<script src="https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js"></script>
<script src="assets/tooltips.js"></script>
<script id="codex-visualization-lucide" async src="https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js"></script>
<script src="assets/icons.js"></script>

</body>
</html>
